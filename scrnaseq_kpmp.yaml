# Listing of sample groupings and cell type groupings
# to simplify parallelized processing in Snakemake workflows.

# Thresholds to use for comparisons. Below these, consider there to be insufficient data to make a comparison.
thresholds:
  # Min cells per cell type and sample.
  min_cells_per_sample: 25
  # Min number of samples per sample group (e.g. AKI, CKD, Healthy Reference) for a given cell type to be included in comparisons.
  min_samples_per_group: 3
  # Min number of counts per gene (post-pseudobulk-aggregation) for a gene to be considered expressed in the pseudobulk sample (independently computed per cell type).
  min_counts_per_gene: 10
  # Min percentage of samples expressing gene (post-pseudobulk-aggregation) for a gene to be included in comparisons.
  min_frac_samples_per_gene: 0.5

