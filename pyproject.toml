[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compasce_degs"
version = "0.0.1"
authors = [
  { name="Mark Keller", email="mark_keller@hms.harvard.edu" },
]
description = "Preprocessing functions that support comparison of single-cell data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["single-cell"]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Science/Research',
  'Programming Language :: Python :: 3.8',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
]
dependencies = [
  'pandas',
  'numpy<=2.0.0',
  'pertpy[de]==1.0.2',
  'decoupler==2.1.2',
  # Due to https://github.com/owkin/PyDESeq2/issues/387
  'pydeseq2==0.5.2',
  'pylemur @ git+https://github.com/keller-mark/pyLemur@94b03c7', # with dask
  #'pylemur @ git+https://github.com/keller-mark/pyLemur@40c9530', # without dask
  'scanpy @ git+https://github.com/keller-mark/scanpy@af55e9d',
  "anndata @ git+https://github.com/keller-mark/anndata@keller-mark/bad-encoding-fallback",
  "numcodecs>=0.5.7,<0.16.0",
  "zarr>=2.5.0,<3",
  'scipy==1.12.0',
  'dask[distributed]',
  'dask-ml',
  'distributed',
  'joblib',
  'scikit-learn>=1.5.1',
  'gprofiler-official',
  #"mudata==0.3.1",
  'filelock>=3.25.2'
]

[project.optional-dependencies]
dev = [
  'build==0.1.0',
  'pytest>=6.2.4',
  'pytest-memray',
  'flake8==3.8.4',
  'jupyterlab',
  #'datrie==0.8.2', # snakemake depends on datrie, and 0.8.3 fails to install.
  #'snakemake<8', # needs --slurm arg
  'pulp<2.8', # Reference: https://github.com/snakemake/snakemake/issues/2607
  'pertpy',
  'requests',
  'altair',
]

[project.urls]
repository = "https://github.com/keller-mark/compasce-degs"


[project.scripts]
compasce2 = "compasce_degs.pipeline_cli:run_cli"


# Reference: https://stackoverflow.com/a/74421415
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Reference: https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.hatch.metadata]
allow-direct-references = true

